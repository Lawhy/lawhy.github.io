<rect class="leaf" x="598" y="281" width="62" height="20" rx="10"/><text class="sans leaft" x="629" y="295.0" text-anchor="middle">rollout</text>
<g opacity="0.6"><rect class="rend" x="138" y="318" width="90" height="30" rx="6"/><text class="mathl rend-t" x="183.0" y="336.0" text-anchor="middle">x<tspan class="sub" dy="4">0</tspan></text></g>
<g opacity="0.4"><rect class="samp" x="232" y="318" width="80" height="30" rx="6"/><text class="mathl samp-t" x="272.0" y="336.0" text-anchor="middle">y<tspan class="sub" dy="4">0</tspan></text></g>
