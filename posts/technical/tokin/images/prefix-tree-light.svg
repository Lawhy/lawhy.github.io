<g><rect class="rend" x="138" y="192" width="90" height="30" rx="6"/><text class="mathl rend-t" x="183.0" y="210.0" text-anchor="middle">x<tspan class="sub" dy="4">0</tspan></text></g>
<g><rect class="samp" x="232" y="192" width="80" height="30" rx="6"/><text class="mathl samp-t" x="272.0" y="210.0" text-anchor="middle">y<tspan class="sub" dy="4">0</tspan></text></g>
<g opacity="0.6"><rect class="rend" x="138" y="234" width="90" height="30" rx="6"/><text class="mathl rend-t" x="183.0" y="252.0" text-anchor="middle">x<tspan class="sub" dy="4">0</tspan></text></g>
<g opacity="0.4"><rect class="samp" x="232" y="234" width="80" height="30" rx="6"/><text class="mathl samp-t" x="272.0" y="252.0" text-anchor="middle">y<tspan class="sub" dy="4">0</tspan></text></g>
<g><rect class="rend" x="316" y="234" width="50" height="30" rx="6"/><text class="mathl rend-t" x="341.0" y="252.0" text-anchor="middle"><tspan font-style="normal">Δ</tspan><tspan class="sub" dy="4">1</tspan></text></g>
<g><rect class="samp" x="370" y="234" width="80" height="30" rx="6"/><text class="mathl samp-t" x="410.0" y="252.0" text-anchor="middle">y<tspan class="sub" dy="4">1</tspan></text></g>
<g opacity="0.6"><rect class="rend" x="138" y="276" width="90" height="30" rx="6"/><text class="mathl rend-t" x="183.0" y="294.0" text-anchor="middle">x<tspan class="sub" dy="4">0</tspan></text></g>
<g opacity="0.4"><rect class="samp" x="232" y="276" width="80" height="30" rx="6"/><text class="mathl samp-t" x="272.0" y="294.0" text-anchor="middle">y<tspan class="sub" dy="4">0</tspan></text></g>
<g opacity="0.6"><rect class="rend" x="316" y="276" width="50" height="30" rx="6"/><text class="mathl rend-t" x="341.0" y="294.0" text-anchor="middle"><tspan font-style="normal">Δ</tspan><tspan class="sub" dy="4">1</tspan></text></g>
<g opacity="0.4"><rect class="samp" x="370" y="276" width="80" height="30" rx="6"/><text class="mathl samp-t" x="410.0" y="294.0" text-anchor="middle">y<tspan class="sub" dy="4">1</tspan></text></g>
<g><rect class="rend" x="454" y="276" width="50" height="30" rx="6"/><text class="mathl rend-t" x="479.0" y="294.0" text-anchor="middle"><tspan font-style="normal">Δ</tspan><tspan class="sub" dy="4">2</tspan></text></g>
<g><rect class="samp" x="508" y="276" width="80" height="30" rx="6"/><text class="mathl samp-t" x="548.0" y="294.0" text-anchor="middle">y<tspan class="sub" dy="4">2</tspan></text></g>
<rect class="leaf" x="598" y="281" width="62" height="20" rx="10"/><text class="sans leaft" x="629" y="295.0" text-anchor="middle">rollout</text>
<g opacity="0.6"><rect class="rend" x="138" y="318" width="90" height="30" rx="6"/><text class="mathl rend-t" x="183.0" y="336.0" text-anchor="middle">x<tspan class="sub" dy="4">0</tspan></text></g>
<g opacity="0.4"><rect class="samp" x="232" y="318" width="80" height="30" rx="6"/><text class="mathl samp-t" x="272.0" y="336.0" text-anchor="middle">y<tspan class="sub" dy="4">0</tspan></text></g>
<g><rect class="edit" x="316" y="318" width="50" height="30" rx="6"/><text class="mathl edit-t" x="341.0" y="336.0" text-anchor="middle"><tspan font-style="normal">Δ</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">′</tspan></text></g>
<g><rect class="samp" x="370" y="318" width="80" height="30" rx="6"/><text class="mathl samp-t" x="410.0" y="336.0" text-anchor="middle">y<tspan class="sub" dy="4">1</tspan><tspan dy="-4">′</tspan></text></g>
